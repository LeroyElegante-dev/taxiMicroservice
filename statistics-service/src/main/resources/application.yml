server:
  port: 8084

spring:
  application:
    name: statistics-service
  datasource:
    url: jdbc:postgresql://localhost:5433/taxi
    username: taxi
    password: taxi

taxi:
  security:
    enabled: true
  jwt:
    secret: ${TAXI_JWT_SECRET:local-dev-secret-change-me-use-at-least-32-bytes-for-production-demo-key!!}
    expiration-seconds: 86400

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
