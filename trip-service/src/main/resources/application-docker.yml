spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/taxi
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: redis
      port: 6379

taxi:
  user-service:
    url: http://user-service:8080
  notification-service:
    url: http://notification-service:8083
  jwt:
    secret: ${TAXI_JWT_SECRET}
