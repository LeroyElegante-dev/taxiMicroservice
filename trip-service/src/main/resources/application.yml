server:
  port: 8081

spring:
  application:
    name: trip-service
  datasource:
    url: jdbc:postgresql://localhost:5433/taxi
    username: taxi
    password: taxi
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false

taxi:
  user-service:
    url: http://localhost:8080
  trip:
    price-per-km: 50.00

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
