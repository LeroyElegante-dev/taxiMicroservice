server:
  port: 8080

spring:
  application:
    name: user-service
  datasource:
    # порт как в docker-compose (5433), не 5432 — иначе часто попадаете в локальный Postgres Windows
    url: jdbc:postgresql://localhost:5433/taxi
    username: taxi
    password: taxi
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
