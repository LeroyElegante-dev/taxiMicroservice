server:
  port: 8083

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5433/taxi
    username: taxi
    password: taxi
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_notification_service_history
    baseline-on-migrate: true
    baseline-version: 0

taxi:
  security:
    enabled: true
  jwt:
    secret: ${TAXI_JWT_SECRET:local-dev-secret-change-me-use-at-least-32-bytes-for-production-demo-key!!}
    expiration-seconds: 86400
  notification:
    worker:
      pool-size: 4
      processing-delay-ms: 400
      idle-poll-ms: 150
      simulated-failure-rate: 0.0

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
